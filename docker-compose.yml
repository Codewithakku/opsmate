# Single-origin setup: frontend UI, backend REST API and WebSocket are ALL
# served through Caddy on host port 3001 → http://localhost:3001
#
#   /                   → Next.js frontend (internal port 5173)
#   /api/search         → Next.js route handler (streaming + tiered fallback)
#   /api/assist         → Next.js streaming route handler
#   /api/health         → Express backend (internal port 5000)
#   /api/classify       → Express backend
#   /api/test-order     → Express backend
#   /api/backend-search → Express backend /api/search (alias)
#   /ws                 → backend WebSocket
#
# Local npm dev does not use Caddy: frontend :3001, backend :5000.
# Do NOT run local dev and this stack at the same time — both use host :3001.

services:
  caddy:
    image: caddy:2-alpine
    container_name: opsmate-caddy
    ports:
      - "3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_WS_URL=ws://localhost:3001/ws
        - NEXT_PUBLIC_API_URL=http://localhost:3001

    expose:
      - "5173"

    env_file:
      - ./.env
      - ./frontend/.env.local

    environment:
      # Browser-side: same origin (Caddy). These are baked in at image BUILD time via args above.
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001/ws
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      # Server-side inside the compose network: go straight to the backend.
      - BACKEND_URL=http://backend:5000

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "5000"

    env_file:
      - ./.env
      - ./backend/.env

    environment:
      - PORT=5000

    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: opsmate
      POSTGRES_USER: opsmate
      POSTGRES_PASSWORD: opsmate_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: